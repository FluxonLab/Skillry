name: Authorized Skillry release chain

on:
  push:
    branches:
      - codex/skillry-v2-daily-use-20260821
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skillry-authorized-release-chain
  cancel-in-progress: false

jobs:
  build-release-chain:
    if: github.ref == 'refs/heads/codex/skillry-v2-daily-use-20260821'
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.2.1, v1.3.0 and v2.0.0 commits and fast-forward the branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: codex/skillry-v2-daily-use-20260821
          TREE_121: dce7a1adedb669f7fcaf4478ed4692070bab46c6
          TREE_130: 16fc9e2b0b2f643b4517d4357782f1d36f7301ad
          TREE_200: b05b3e21fb1c81e8ec3f6c3ee5f1d7d99e8871a1
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'skillry-authorized-release-chain',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read().decode('utf-8')
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode('utf-8', errors='replace')
                  raise SystemExit(f'GitHub API {method} {path} failed: {exc.code} {detail}')

          head = request('GET', f'/git/ref/heads/{branch}')['object']['sha']

          releases = [
              (
                  '1.2.1',
                  os.environ['TREE_121'],
                  'fix: release v1.2.1 daily-use hotfix\n\n'
                  '- separate distributable project guidance from Skillry repository governance\n'
                  '- correct platform targeting and public claims\n'
                  '- repair critical high-risk skill guidance and safety wording\n'
                  '- refresh release metadata without publishing',
              ),
              (
                  '1.3.0',
                  os.environ['TREE_130'],
                  'feat: release v1.3.0 installer and registry hardening\n\n'
                  '- install complete skill bundles instead of only SKILL.md\n'
                  '- add collision-safe ownership, verification, update and uninstall behavior\n'
                  '- enforce lock drift and structural validation in CI\n'
                  '- add native platform adapter contracts and isolated lifecycle tests',
              ),
              (
                  '2.0.0',
                  os.environ['TREE_200'],
                  'feat!: release v2.0.0 daily-use lifecycle\n\n'
                  '- introduce capability-aware platform adapters and lock v2 provenance\n'
                  '- add verify, update, rollback, uninstall and doctor lifecycle commands\n'
                  '- separate Antigravity IDE and CLI output formats\n'
                  '- harden state paths, atomic installs, restoration and community imports\n\n'
                  'BREAKING CHANGE: install locations, state format and platform adapters now follow the v2 contract.',
              ),
          ]

          parent = head
          created = []
          for version, tree, message in releases:
              commit = request('POST', '/git/commits', {
                  'message': message,
                  'tree': tree,
                  'parents': [parent],
              })
              parent = commit['sha']
              created.append((version, parent))

          request('PATCH', f'/git/refs/heads/{branch}', {
              'sha': parent,
              'force': False,
          })

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as fh:
                  fh.write('## Authorized Skillry release chain\n\n')
                  for version, sha in created:
                      fh.write(f'- `{version}`: `{sha}`\n')
                  fh.write('\nBranch was fast-forwarded without publishing or merging.\n')
          print('\n'.join(f'{version} {sha}' for version, sha in created))
          PY
