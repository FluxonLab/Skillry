name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Structure, frontmatter, permissions & attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository (structure, frontmatter, least-privilege, attribution)
        run: python3 tools/validate.py

      - name: Rebuild marketplace.json and check it is committed
        run: |
          python3 tools/build-marketplace.py --apply
          if ! git diff --quiet -- .claude-plugin/marketplace.json; then
            echo "::error::marketplace.json is out of date. Run: python3 tools/build-marketplace.py --apply"
            git --no-pager diff -- .claude-plugin/marketplace.json
            exit 1
          fi

      - name: Check repository-only instruction adapters (no writes)
        run: |
          python3 tools/build-agent-instructions.py --check
          python3 tests/test_agent_instruction_family.py

      - name: Validate optional Jev contracts and portable instruction boundary
        run: python3 -m unittest discover -s tests -p 'test_jev*.py'

      - name: Run the full unit test suite (storage, installer and every other contract)
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Validate native Cursor installation contracts
        run: python3 tests/test_cursor_install.py

      - name: Dry-run installer for all platforms (no writes)
        run: python3 tools/install.py --targets claude codex copilot antigravity cursor opencode

  install-smoke:
    name: Install into a throwaway home (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install every target from the checkout (--apply) and count skills and agents
        run: python tests/install_smoke.py repo
      - name: Pack the npm tarball, install from the packed CLI (--apply) and count
        run: python tests/install_smoke.py package
      - name: Import the packaged runtime modules (POSIX only; the storage engine needs fcntl)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pack_dir="$(mktemp -d)"
          tarball="$(npm pack --pack-destination "$pack_dir" | tail -n 1)"
          tar -xzf "$pack_dir/$tarball" -C "$pack_dir"
          PYTHONPATH="$pack_dir/package/tools" python3 -c "import jev.core, jev.operations, storage.engine, storage.transfer"
