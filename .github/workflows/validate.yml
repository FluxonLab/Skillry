name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Structure, frontmatter, permissions & attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository (structure, frontmatter, least-privilege, attribution)
        run: python3 tools/validate.py

      - name: Rebuild marketplace.json and check it is committed
        run: |
          python3 tools/build-marketplace.py --apply
          if ! git diff --quiet -- .claude-plugin/marketplace.json; then
            echo "::error::marketplace.json is out of date. Run: python3 tools/build-marketplace.py --apply"
            git --no-pager diff -- .claude-plugin/marketplace.json
            exit 1
          fi

      - name: Check repository-only instruction adapters (no writes)
        run: |
          python3 tools/build-agent-instructions.py --check
          python3 tests/test_agent_instruction_family.py

      - name: Validate optional Jev contracts and portable instruction boundary
        run: python3 -m unittest discover -s tests -p 'test_jev*.py'

      - name: Validate native Cursor installation contracts
        run: python3 tests/test_cursor_install.py

      - name: Dry-run installer for all platforms (no writes)
        run: python3 tools/install.py --targets claude codex copilot antigravity cursor

  install-smoke:
    name: Install into a throwaway HOME and re-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install into isolated HOME (does not touch the runner's real config)
        run: |
          skillry_smoke_home="$(mktemp -d)"
          env HOME="$skillry_smoke_home" python3 tools/install.py --apply --targets claude codex copilot antigravity cursor
          echo "Installed skills (claude): $(find "$skillry_smoke_home/.claude/skills" -name SKILL.md | wc -l)"
          test "$(find "$skillry_smoke_home/.claude/skills" -name SKILL.md | wc -l)" -ge 50
          test "$(ls "$skillry_smoke_home/.codex/agents/"*.toml | wc -l)" -ge 60
          test "$(find "$skillry_smoke_home/.cursor/skills" -name SKILL.md | wc -l)" -ge 50
          test "$(ls "$skillry_smoke_home/.cursor/agents/"*.md | wc -l)" -ge 60
