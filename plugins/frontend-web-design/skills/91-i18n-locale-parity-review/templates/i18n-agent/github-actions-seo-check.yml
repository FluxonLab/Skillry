# Copy into .github/workflows/i18n-seo-check.yml and adjust paths.
name: Multilingual i18n SEO check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  i18n-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build your site so dist/ exists — example only:
      # - run: npm ci && npm run build

      - name: Validate locale registry
        run: |
          python skills/multilingual-i18n-seo/scripts/validate_locale_registry.py \
            path/to/locale-registry.json

      - name: Check HTML output
        run: |
          python skills/multilingual-i18n-seo/scripts/check_i18n_seo.py \
            --root dist \
            --registry path/to/locale-registry.json \
            --sitemap dist/sitemap-0.xml \
            --format both \
            --fail-on error
